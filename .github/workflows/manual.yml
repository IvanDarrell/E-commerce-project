name: Selenium TestNG Tests

on:
  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ==========================================
      # 1. Checkout project
      # ==========================================
      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven


      # ==========================================
      # 3. Wait for MySQL
      # ==========================================
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              echo "MySQL is ready"
              break
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done


      # ==========================================
      # 4. Import ecommerce database
      # ==========================================
      - name: Import ecommerce database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot ecommerce < ecommerce.sql


      # ==========================================
      # 5. Start Selenium Grid
      # ==========================================
      - name: Start Selenium Grid
        run: |
          docker compose up -d


      # ==========================================
      # 6. Check Selenium containers
      # ==========================================
      - name: Check Selenium Grid containers
        run: |
          docker compose ps


      # ==========================================
      # 7. Wait for Selenium Grid
      # ==========================================
      - name: Wait for Selenium Grid
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium Grid is ready"
              break
            fi

            echo "Waiting for Selenium Grid..."
            sleep 2
          done


      # ==========================================
      # 8. Show Grid status
      # ==========================================
      - name: Selenium Grid status
        run: |
          curl -s http://localhost:4444/status


      # ==========================================
      # 9. Run TestNG suite
      # ==========================================
      - name: Run TestNG suite
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/ecommerce
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mvn clean test -Dsurefire.suiteXmlFiles=testng.xml


      # ==========================================
      # 10. Upload Extent Report
      # ==========================================
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/report/


      # ==========================================
      # 11. Upload TestNG Report
      # ==========================================
      - name: Upload TestNG Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: target/surefire-reports/


      # ==========================================
      # 12. Stop Selenium Grid
      # ==========================================
      - name: Stop Selenium Grid
        if: always()
        run: |
          docker compose down
