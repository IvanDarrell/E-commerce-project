
services:
  selenium-hub:
    image: selenium/hub:4.48.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
    networks:
      - selenium

  chrome:
    image: selenium/node-chrome:4.48.0
    container_name: selenium-chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    ports:
      - "7900:7900"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium

  edge:
    image: selenium/node-edge:4.48.0
    container_name: selenium-edge
    shm_size: 2gb
    depends_on:
      - selenium-hub
    ports:
      - "7901:7900"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium

  selenium-firefox:
    image: selenium/node-firefox:4.48.0
    container_name: selenium-firefox
    shm_size: 2gb
    depends_on:
      - selenium-hub
    ports:
      - "7903:7900"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium

networks:
  selenium:
    name: selenium